name: yash-24bcs10164-network
services:
  frontend:
    image: nginx:stable-alpine
    networks: [edge, isolated]
    ports: ["127.0.0.1:8180:80"]
  backend:
    image: nginx:stable-alpine
    command: ["sh", "-c", "printf 'Network backend - Yash Agrawal 24bcs10164' > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;'"]
    networks: [edge, data]
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Provide a temporary password}
      MYSQL_DATABASE: network_lab
    volumes: [mysql-data:/var/lib/mysql]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
networks:
  edge: {}
  data: {internal: true}
  isolated: {}
volumes:
  mysql-data: {}
