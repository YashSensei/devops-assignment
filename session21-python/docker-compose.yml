name: kitledger-24bcs10164
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitledger
      POSTGRES_DB: kitledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-local.ps1 first}
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitledger -d kitledger"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kitledger:${POSTGRES_PASSWORD}@postgres:5432/kitledger
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    restart: unless-stopped
volumes:
  ledger-data:
