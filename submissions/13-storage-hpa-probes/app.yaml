apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: web-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 500Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storage-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: storage-web}}
  template:
    metadata: {labels: {app: storage-web}}
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine
          ports: [{name: http, containerPort: 80}]
          startupProbe: {httpGet: {path: /, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5, failureThreshold: 2}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 96Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: web-data}
---
apiVersion: v1
kind: Service
metadata: {name: storage-web}
spec:
  selector: {app: storage-web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: storage-web}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: storage-web}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
