apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-11-multi-container
  labels: {exercise: lifecycle}
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: nginx:stable-alpine
    - name: sidecar
      image: alpine:3.22
      command: [sh, -c, "while true; do echo sidecar-alive; sleep 10; done"]
