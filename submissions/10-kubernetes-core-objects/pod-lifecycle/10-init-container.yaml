apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-10-init-container
  labels: {exercise: lifecycle}
spec:
  restartPolicy: Always
  initContainers:
    - name: init
      image: alpine:3.22
      command: [sh, -c, "echo init-complete"]
  containers:
    - name: app
      image: nginx:stable-alpine
