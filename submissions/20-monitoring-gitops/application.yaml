apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coursework-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YashSensei/devops-assignment.git
    targetRevision: main
    path: submissions/20-monitoring-gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: coursework-gitops
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
